# Source of truth for agent catalog docs.
# Update this file when adding a new agent, then run:
#   python scripts/sync_adk_agent_docs.py

tracks:
  foundational:
    label: Foundational (single-agent)
    dir: foundational
    path_id: "3545"
    title: Develop Agents with Agent Development Kit (ADK)
    path_url: https://www.skills.google/paths/3545
    badge_name: Engineer AI Agents with Agent Development Kit (ADK)
    badge_url: https://www.credly.com/badges/14b4692b-b475-4b7f-adab-2b4ca2d532c2
    summary: >-
      Single LlmAgent concepts — setup, instructions, session state,
      tools, and MCP integration.

  multi_agent:
    label: Multi-agent
    dir: multi_agent
    path_id: "3877"
    title: Multi-Agent ADK
    path_url: https://www.skills.google/paths/3877
    summary: >-
      Orchestration patterns — sub-agents, pipelines, and coordinated
      multi-agent workflows.

  deployment:
    label: Deployment
    dir: deployment
    title: Deploy ADK Agents to Google Cloud
    path_url: https://google.github.io/adk-docs/deploy/
    summary: >-
      Agent Engine and Cloud Run — deploy commands, platform comparison,
      and production session persistence.

agents:
  - track: multi_agent
    folder: customer_service
    name: customer_service_coordinator
    module: "Module — Multi-agent hierarchy"
    topic: Coordinator + billing & technical specialists
    learned:
      - Single agents get overwhelmed when one instruction covers many domains
      - sub_agents creates a parent-child hierarchy with specialist children
      - Coordinator routes billing vs technical questions to the right expert
      - Each agent has at most one parent; use agent.find_agent(name) to navigate
    run: adk run multi_agent.customer_service
    env_template: enterprise
    try_queries:
      - "I was charged twice on my last invoice"
      - "The app crashes when I try to log in"
      - "What are your business hours?"

  - track: multi_agent
    folder: sequential_pipeline
    name: request_pipeline
    module: "Module — Workflow agents"
    topic: SequentialAgent — intake → analyze → respond
    learned:
      - SequentialAgent runs sub-agents in fixed list order (A → B → C)
      - "output_key saves each step to session state for the next step"
      - "{key} templating reads previous step output — deterministic, not LLM routing"
      - Use when each step must finish before the next begins
    run: adk run multi_agent.sequential_pipeline
    env_template: enterprise
    try_queries:
      - "Help me plan a team offsite for 20 people in Austin"

  - track: multi_agent
    folder: parallel_research
    name: research_pipeline
    module: "Module — Workflow agents"
    topic: ParallelAgent + SequentialAgent — parallel research → summarize
    learned:
      - ParallelAgent runs sub-agents concurrently for speed
      - Each parallel branch needs a distinct output_key to avoid state conflicts
      - Nest ParallelAgent inside SequentialAgent when parallel work precedes a merge step
      - "Summarizer reads {benefits} and {challenges} after all branches complete"
    run: adk run multi_agent.parallel_research
    env_template: enterprise
    try_queries:
      - "Give me an overview of renewable energy pros and cons"

  - track: multi_agent
    folder: balanced_research
    name: balanced_research
    module: "Module — Orchestrate complex workflows"
    topic: Parallel research + aggregation — benefits & challenges → summary
    learned:
      - Choose SequentialAgent when steps depend on each other; ParallelAgent when independent
      - Parallel agents need distinct output_key values to avoid state conflicts
      - Wrap ParallelAgent inside SequentialAgent so aggregator runs after all branches finish
      - Aggregation pattern — summarizer reads {benefits} and {challenges} from shared state
    run: adk run multi_agent.balanced_research
    env_template: enterprise
    try_queries:
      - "Research artificial intelligence in healthcare"
      - "Research renewable energy adoption"
      - "Research remote work for software teams"

  - track: multi_agent
    folder: doc_processor
    name: document_processor
    module: "Module — State in workflows"
    topic: Configurable doc processor — session + user namespaces
    learned:
      - Session state holds workflow outputs — document_content, topics, sentiment, summary
      - "user:summary_format reads user preference via {user:summary_format?bullet points}"
      - Parallel analyzers use distinct output_key values to avoid state conflicts
      - State accumulates through the pipeline and persists for follow-up questions
    run: adk run multi_agent.doc_processor
    env_template: enterprise
    try_queries:
      - >-
        Process this document: "The new product launch exceeded expectations. Sales jumped
        40% in the first week. Customer feedback has been overwhelmingly positive, with 95%
        satisfaction ratings."
      - "What topics did you identify?"
      - "Summarize using paragraph format instead of bullet points"

  - track: multi_agent
    folder: conditional_router
    name: conditional_pipeline
    module: "Module — Custom agents"
    topic: ConditionalRouter — dynamic routing with BaseAgent
    learned:
      - Workflow agents run all sub-agents in their pattern — they cannot skip or branch
      - Use BaseAgent + _run_async_impl for conditional skipping and dynamic routing
      - Classifier sets request_type; ConditionalRouter reads state and delegates
      - Default to workflow agents; custom agents only when if/else logic is required
    run: adk run multi_agent.conditional_router
    env_template: enterprise
    try_queries:
      - "I was charged twice for my subscription last month"
      - "How do I reset my password?"
      - "My invoice shows the wrong amount and I need help updating my profile"

  - track: multi_agent
    folder: a2a_demo
    name: research_coordinator
    module: "Module 4 — A2A protocol"
    topic: Agent2Agent — expose specialist + consume via RemoteA2aAgent
    learned:
      - A2A is an open standard for agents to communicate across networks and services
      - Local expose — to_a2a(agent) + uvicorn for development
      - Cloud expose — agent.json + adk deploy cloud_run --a2a for production
      - Consume side — RemoteA2aAgent connects using the remote agent card URL
      - Agent card JSON describes name, skills, capabilities, and endpoint url
      - RemoteA2aAgent client — agent_card can be a local JSON file or URL
      - AgentTool vs sub_agents — explicit tool call vs LLM conversation transfer
    run: adk run multi_agent/a2a_demo
    env_template: enterprise
    install_extra: "pip install 'google-adk[a2a]'"
    run_steps:
      - label: "Local — start remote specialist (Terminal 1)"
        command: >-
          uvicorn multi_agent.a2a_demo.remote_research_specialist.agent:a2a_app
          --host localhost --port 8001
      - label: "Local — run coordinator (Terminal 2)"
        command: adk run multi_agent/a2a_demo
      - label: "Cloud — deploy as A2A server (see agent.json + README)"
        command: >-
          adk deploy cloud_run --project=$GOOGLE_CLOUD_PROJECT --region=us-central1
          --service_name=research-specialist --a2a
          multi_agent/a2a_demo/remote_research_specialist
    try_queries:
      - "Research the impact of AI on healthcare"
      - "What are the main trends in renewable energy?"
      - "Hello — what can you help me with?"

  - track: multi_agent
    folder: refinement_loop
    name: writing_pipeline
    module: "Module — Workflow agents"
    topic: LoopAgent — draft → check → improve (repeat)
    learned:
      - LoopAgent repeats sub-agents until max_iterations is reached
      - Always set max_iterations to prevent infinite loops
      - Good for iterative refinement — checker gives feedback, improver updates draft
      - Combine with SequentialAgent — draft first, then loop for quality passes
    run: adk run multi_agent.refinement_loop
    env_template: enterprise
    try_queries:
      - "Write about the importance of renewable energy"

  - track: multi_agent
    folder: research_pipeline
    name: article_pipeline
    module: "Module — Agent communication"
    topic: State-based communication — research → write → edit
    learned:
      - Agents share data through session state — output_key writes, {key} reads
      - Researcher saves to research_findings; writer reads it and writes draft_article
      - Editor reads {draft_article} and returns the polished final version
      - All agents in the pipeline share the same session state
    run: adk run multi_agent.research_pipeline
    env_template: enterprise
    try_queries:
      - "Write an article about renewable energy"
      - "Write an article about the future of electric vehicles"

  - track: multi_agent
    folder: film_concept_team
    name: greeter
    module: "Module — Workflow capstone"
    topic: Film pitch — Sequential + Loop + Parallel workflow capstone
    learned:
      - SequentialAgent — writers_room → preproduction_team → file_writer in order
      - LoopAgent — researcher → screenwriter → critic until exit_loop (max 5)
      - ParallelAgent — box_office_researcher + casting_agent run concurrently
      - output_key on parallel agents (box_office_report, casting_report) avoids conflicts
      - tool_context.state + {key?} for PROMPT, research, PLOT_OUTLINE, CRITICAL_FEEDBACK
    run: adk run multi_agent/film_concept_team
    env_template: enterprise
    install_extra: "pip install langchain-core langchain-community wikipedia"
    try_queries:
      - "Ada Lovelace"
      - "Marie Curie"

  - track: multi_agent
    folder: customer_service_app_multi_agent
    name: customer_service_app_multi_agent
    module: "Module — Capstone"
    topic: Customer service app — intake → parallel → respond
    learned:
      - Intake writes ticket_info; parallel researchers read {ticket_info}
      - billing_researcher → billing_findings; technical_researcher → technical_findings
      - Responder combines all state keys into one customer-facing answer
      - SequentialAgent + ParallelAgent + output_key + {key} in one production-style app
    run: adk run multi_agent.customer_service_app_multi_agent
    env_template: enterprise
    try_queries:
      - "I was charged twice for my subscription last month. The charge was on December 15th."
      - "The app crashes every time I try to upload a photo. I'm using an iPhone 14."
      - "I can't log in to my account and I think I'm being charged even though I canceled."
      - "I was double-charged on my subscription and the app won't let me update my card"

  - track: foundational
    folder: simple_agent_module1
    name: math_tutor
    module: "Module 1–3"
    topic: Simple agent & programmatic runner
    learned:
      - Basic LlmAgent / Agent setup with gemini-3.6-flash
      - Agent folder naming (underscores, valid Python identifiers)
      - Running via adk run, adk api_server, and curl /run
      - Programmatic Runner + InMemorySessionService
      - load_dotenv and session state from environment variables
    run: python foundational/simple_agent_module1/agent.py
    env_template: vertexai
    try_queries:
      - "What is 2x + 5 = 13?"

  - track: foundational
    folder: agent_with_yaml
    name: root_agent
    module: "Module — YAML"
    topic: Declarative agent configuration
    learned:
      - Define agents in root_agent.yaml instead of agent.py
      - Instruction, model, and metadata without Python code
      - Same adk web / adk run workflow as code-based agents
    run: adk run foundational.agent_with_yaml
    env_template: enterprise
    try_queries:
      - "How do I solve x² - 5x + 6 = 0?"

  - track: foundational
    folder: customer_support_agent
    name: support_specialist
    module: "Module — Instructions"
    topic: Optimized instruction design
    learned:
      - Structured prompts (identity, mission, methodology, boundaries)
      - Persona and tone control for production-style agents
      - load_dotenv for API credentials
    run: adk run foundational.customer_support_agent
    env_template: enterprise
    try_queries:
      - "My order #4521 hasn't arrived yet and I need it by Friday"

  - track: foundational
    folder: product_extractor
    name: product_extractor
    module: "Module — Structured output"
    topic: Pydantic output_schema & output_key
    learned:
      - Pydantic models to enforce JSON response shape
      - output_schema validates model output automatically
      - output_key stores parsed result in session state for reuse
    run: adk run foundational.product_extractor
    env_template: enterprise
    try_queries:
      - "I bought the iPhone 15 Pro 256GB in blue for $999"

  - track: foundational
    folder: model_comparison
    name: data_extractor / creative_brainstormer
    module: "Module — Model config"
    topic: generate_content_config tuning
    learned:
      - temperature, top_p, top_k for factual vs creative behavior
      - max_output_tokens and multi-agent comparison patterns
      - safety_settings (HarmCategory, HarmBlockThreshold)
    run: adk run foundational.model_comparison
    env_template: enterprise
    try_queries:
      - "data_extractor: Extract facts from — The Eiffel Tower is 330 meters tall and was completed in 1889."
      - "creative_brainstormer: Brainstorm 5 names for a sustainable coffee brand"

  - track: foundational
    folder: problem_solver_reasoning_agent
    name: strategic_problem_solver
    module: "Module — Planning"
    topic: BuiltInPlanner & thinking
    learned:
      - BuiltInPlanner with ThinkingConfig for Gemini models
      - include_thoughts and thinking_budget for visible reasoning
      - When to use BuiltInPlanner vs PlanReActPlanner
    run: adk run foundational.problem_solver_reasoning_agent
    env_template: enterprise
    try_queries:
      - "How can a small startup compete with established market leaders?"

  - track: foundational
    folder: name_extractor_memory
    name: name_extractor
    module: "Module — Session state"
    topic: output_key & session memory
    learned:
      - output_key saves agent response to session.state automatically
      - Access state programmatically via session.state.get("user_name")
      - State persists across multiple turns in the same session
      - Programmatic testing with Runner and InMemorySessionService
    run: python foundational/name_extractor_memory/test_state.py
    env_template: enterprise
    try_queries:
      - "Hi, my name is Alex Johnson"
      - "What's my name? (follow-up in same session)"

  - track: foundational
    folder: memory_bank
    name: memory_assistant
    module: "Module — Memory Bank"
    topic: Cross-session memory — load_memory + auto-save callback
    learned:
      - Session state = this conversation; Memory Bank = across all conversations
      - after_agent_callback + add_session_to_memory saves turns automatically
      - load_memory tool searches past conversations semantically
      - Production uses VertexAiMemoryBankService (LLM extraction, managed GCP)
      - Local demo uses InMemoryMemoryService with the same Runner API pattern
    run: python foundational/memory_bank/test_memory.py
    env_template: enterprise
    try_queries:
      - "My favorite color is blue and I love hiking on weekends."
      - "What do you remember about my hobbies and favorite color? (new session)"

  - track: foundational
    folder: personalized_greeter
    name: personalized_greeter
    module: "Module — State templating"
    topic: "{key} instruction templating"
    learned:
      - Inject session.state into instructions with {key} syntax
      - Optional defaults with {key?default} and conditional blocks
      - ADK resolves templates before sending instructions to the LLM
      - Instructions adapt dynamically based on available state
    run: python foundational/personalized_greeter/test_templating.py
    env_template: enterprise
    try_queries:
      - "Hello (first turn — no name in state yet)"
      - "Hello again (after name is saved to session state)"

  - track: foundational
    folder: namespace_demo
    name: namespace_demo
    module: "Module — State namespaces"
    topic: temp / session / user / app scopes
    learned:
      - Four state namespaces with different persistence lifetimes
      - temp: current turn only, session (no prefix) per conversation
      - user: persists across sessions for same user
      - app: global config shared by all users
    run: python foundational/namespace_demo/test_namespaces.py
    env_template: enterprise
    try_queries:
      - "Show me the namespace values"
      - "What persisted from my last session? (new session)"

  - track: foundational
    folder: geography_assistant
    name: geography_assistant
    module: "Module — Tools"
    topic: Function tools + Google Search
    learned:
      - Custom function tools with Python functions and docstrings
      - Built-in google_search tool for live web facts
      - google_search cannot mix with function tools on one agent without bypass_multi_tools_limit
      - ADK wraps Google Search as a sub-agent when combined with custom tools
    run: python foundational/geography_assistant/test_tools.py
    env_template: enterprise
    try_queries:
      - "What is the capital of France?"
      - "What is the current population of Tokyo?"

  - track: foundational
    folder: file_reader_mcp
    name: file_reader_assistant
    module: "Module — MCP tools"
    topic: McpToolset + filesystem server
    learned:
      - Connect to MCP servers via McpToolset (stdio or SSE)
      - Browse MCP catalog at registry.modelcontextprotocol.io
      - StdioConnectionParams — local subprocess (development, e.g. npx)
      - SseConnectionParams — remote HTTP/SSE (production)
      - tool_filter limits exposed tools to safe read-only operations
      - Requires Node.js/npm and pip install 'mcp>=1.0,<2' (MCP SDK)
    run: python foundational/file_reader_mcp/test_mcp.py
    env_template: enterprise
    try_queries:
      - "List all files in the allowed folder"
      - "Read the contents of hello.txt"

  - track: deployment
    folder: weather_agent
    name: weather_agent
    module: "Hands-on — Agent Engine"
    topic: Deploy a simple agent to Vertex AI Agent Engine
    learned:
      - adk deploy agent_engine packages and deploys with one command (~5–10 min)
      - VertexAiSessionService is configured automatically — no code changes needed
      - Agent Engine is Python-only; use Cloud Run for Go/Java or --with_ui
      - Local dev uses InMemorySessionService; cloud uses persistent VertexAiSessionService
    deploy_only: true
    env_template: gcp_deploy
    install_extra: "pip install 'google-cloud-aiplatform[adk,agent_engines]>=1.111'"
    run_steps:
      - label: Create GCS staging bucket (one-time)
        command: gsutil mb -p $GOOGLE_CLOUD_PROJECT -l us-central1 gs://$BUCKET_NAME
      - label: Deploy to Agent Engine
        command: >-
          adk deploy agent_engine --project=$GOOGLE_CLOUD_PROJECT
          --region=us-central1 --staging_bucket=gs://$BUCKET_NAME
          --display_name="Weather Agent" deployment/weather_agent
      - label: Test deployed agent
        command: python deployment/weather_agent/test_deployed_agent.py
    try_queries:
      - "What's the weather in San Francisco?"
      - "Will it rain tomorrow in Seattle?"

workflow_agents:
  intro: >-
    Workflow agents coordinate sub-agents in a fixed, predictable pattern.
    Unlike the coordinator pattern (LLM decides routing), workflow agents
    provide deterministic execution.
  use_cases:
    - Pipelines — intake → process → respond (fixed order)
    - Parallel tasks — research from multiple sources at once (for speed)
    - Refinement — check quality, improve, repeat until good enough
  types:
    - name: SequentialAgent
      pattern: "A → B → C"
      use_when: Fixed order; each step needs previous output
      keys:
        - Agents run in list order; each waits for the previous to finish
        - "output_key saves output; {key} reads from state"
      reference: https://google.github.io/adk-docs/agents/workflow-agents/sequential-agents/
      demo: sequential_pipeline
    - name: ParallelAgent
      pattern: "A + B + C"
      use_when: Independent tasks; run concurrently for speed
      keys:
        - All sub-agents start at approximately the same time
        - Each branch needs a distinct output_key
        - Waits for all branches to complete
      demo: parallel_research
      reference: https://google.github.io/adk-docs/agents/workflow-agents/parallel-agents/
      demo_orchestration: balanced_research
    - name: LoopAgent
      pattern: "(A → B) × N"
      use_when: Iterative refinement, quality loops, retry patterns
      keys:
        - Repeats sub-agents until max_iterations (always set this!)
        - Each iteration can use output from the previous pass
      reference: https://google.github.io/adk-docs/agents/workflow-agents/loop-agents/
      demo: refinement_loop

workflow_decision_guide:
  title: Choosing the right workflow agent
  reference: https://google.github.io/adk-docs/agents/workflow-agents
  rows:
    - situation: Steps depend on each other
      agent: SequentialAgent
      why: Each step needs previous output
    - situation: Steps are independent
      agent: ParallelAgent
      why: Faster — run at the same time
    - situation: Need to repeat until done
      agent: LoopAgent
      why: Iterative refinement
  parallel_coordination:
    title: Coordinating state with ParallelAgent
    rules:
      - Always use a distinct output_key for each parallel agent
      - Follow with an aggregator agent to combine results via {key} templating
      - Wrap in SequentialAgent — parallel stage first, then aggregator
    demo: balanced_research
    pattern: "SequentialAgent([ParallelAgent(...), aggregator])"

a2a_protocol:
  title: Agent2Agent (A2A) Protocol
  official_site: https://a2a-protocol.org/
  adk_docs: https://google.github.io/adk-docs/a2a/
  exposing_docs: https://google.github.io/adk-docs/a2a/quickstart-exposing/
  consuming_docs: https://google.github.io/adk-docs/a2a/quickstart-consuming/
  intro: >-
    A2A is an open standard that lets agents communicate across networks,
    services, and organizational boundaries. Instead of importing another
    agent as Python code, one agent calls another over HTTP using a shared
    contract called an agent card.
  concepts:
    - name: Expose (server)
      description: >-
        Make your agent available to others as an A2A service. In ADK, wrap
        with to_a2a(agent) and serve via uvicorn, or use adk api_server --a2a.
    - name: Consume (client)
      description: >-
        Let your agent call a remote A2A agent. In ADK, add a RemoteA2aAgent
        sub-agent with the remote agent card URL.
    - name: Agent card
      description: >-
        JSON metadata (name, description, capabilities, skills, url) that
        describes what the remote agent can do. Served at
        /.well-known/agent-card.json.
  when_to_use:
    - Microservices — agents deployed as separate services
    - Cross-team or cross-organization collaboration
    - Different languages or runtimes (not all agents in one Python process)
    - Agents on different networks or cloud environments
  when_not_to_use:
    - Learning ADK basics — start with sub_agents in one codebase
    - Single application where all agents live in the same repo
    - Same team, same deployment — sub_agents or workflow agents are simpler
    - Performance-critical local coordination — A2A adds network overhead
  architecture:
    local: research_coordinator (LlmAgent + RemoteA2aAgent)
    remote: research_specialist (LlmAgent exposed via to_a2a + uvicorn :8001)
    flow: Coordinator delegates → HTTP/A2A → Remote specialist responds
  install: "pip install 'google-adk[a2a]'"
  demo: a2a_demo
  agent_card_path: /.well-known/agent-card.json
  port_note: >-
    Use port 8001 for the remote A2A server so it does not conflict with
    adk web (default port 8000).
  expose_methods:
    - id: local
      name: Local development (to_a2a + uvicorn)
      use_when: Learning, testing, no GCP required
      command: >-
        uvicorn multi_agent.a2a_demo.remote_research_specialist.agent:a2a_app
        --host localhost --port 8001
      note: ADK auto-generates agent card at /.well-known/agent-card.json
    - id: cloud_run
      name: Production (Cloud Run + agent.json)
      use_when: Deploy remote A2A agent to GCP with a public URL
      reference: https://google.github.io/adk-docs/deploy/cloud-run/
  cloud_a2a_deploy:
    title: Deploy agent as an A2A server on Cloud Run
    intro: >-
      An A2A agent identifies itself via an Agent Card (agent.json). Deploy
      with adk deploy cloud_run --a2a so other agents can consume it via
      RemoteA2aAgent using the card url.
    folder: multi_agent/a2a_demo/remote_research_specialist
    files:
      - name: agent.json
        purpose: Agent card — name, description, skills, url, capabilities
      - name: agent.py
        purpose: Agent code with root_agent
      - name: requirements.txt
        purpose: "google-adk[a2a] and dependencies"
    agent_json_fields:
      - field: name
        description: Agent identifier (matches root_agent name)
      - field: description
        description: What the agent does — shown to consuming agents
      - field: skills
        description: Callable capabilities (id, name, description, tags)
      - field: url
        description: >-
          Cloud Run service URL + /a2a/<agent_folder>. Update after first deploy
          or use your known service URL pattern.
      - field: capabilities
        description: Reserved for protocol features like streaming (often {})
      - field: defaultInputModes / defaultOutputModes
        description: Supported content types (e.g. text/plain)
    url_pattern: >-
      https://SERVICE_NAME-PROJECT_HASH.REGION.run.app/a2a/AGENT_FOLDER
    requirements: "google-adk[a2a]"
    deploy_command: >-
      adk deploy cloud_run \
        --project=$GOOGLE_CLOUD_PROJECT \
        --region=us-central1 \
        --service_name=research-specialist \
        --a2a \
        multi_agent/a2a_demo/remote_research_specialist \
        -- \
        --set-env-vars="GOOGLE_CLOUD_LOCATION=global"
    deploy_notes:
      - Create agent.json before deploy — defines the agent card served by the A2A server
      - The --a2a flag exposes only folders that contain agent.json
      - Update agent.json url to match your Cloud Run service URL after deploy
      - Optional — pass service account and env vars after -- (Cloud Run gcloud flags)
      - Consuming agents point RemoteA2aAgent at the deployed agent card URL
    agent_json_example: |
      {
        "name": "research_specialist",
        "description": "Deep research on topics — trends, facts, and key points.",
        "defaultInputModes": ["text/plain"],
        "defaultOutputModes": ["text/plain"],
        "skills": [
          {
            "id": "research_topic",
            "name": "Research Topic",
            "description": "Research a topic and return key facts and trends.",
            "tags": ["research", "analysis"]
          }
        ],
        "url": "https://research-specialist-PROJECT_ID.us-central1.run.app/a2a/remote_research_specialist",
        "capabilities": {},
        "version": "1.0.0"
      }
  a2a_client:
    title: A2A client — calling a remote agent with RemoteA2aAgent
    intro: >-
      On the consume side, create a RemoteA2aAgent pointing at an agent card.
      The card can be a local JSON file, a URL, or an AgentCard object. Add it
      to the parent agent's sub_agents so the LLM can delegate over A2A.
    reference: https://google.github.io/adk-docs/a2a/quickstart-consuming/
    agent_card_sources:
      - source: Local JSON file
        example: illustration-agent-card.json
        use_when: Card saved locally; url inside points to deployed service
      - source: URL
        example: http://localhost:8001/.well-known/agent-card.json
        use_when: Local to_a2a server or known Cloud Run agent card endpoint
      - source: Deployed agent.json url field
        example: https://SERVICE.run.app/a2a/illustration_agent
        use_when: After adk deploy cloud_run --a2a
    local_file_example: |
      from google.adk.agents.remote_a2a_agent import RemoteA2aAgent

      illustration_agent = RemoteA2aAgent(
          name="illustration_agent",
          description="Agent that generates illustrations.",
          agent_card="illustration-agent-card.json",
      )

      root_agent = LlmAgent(
          name="coordinator",
          instruction="Delegate illustration requests to illustration_agent.",
          sub_agents=[illustration_agent],
      )
    url_example: |
      from google.adk.agents.remote_a2a_agent import (
          AGENT_CARD_WELL_KNOWN_PATH,
          RemoteA2aAgent,
      )

      research_specialist = RemoteA2aAgent(
          name="research_specialist",
          description="Remote research expert via A2A.",
          agent_card=f"http://localhost:8001{AGENT_CARD_WELL_KNOWN_PATH}",
      )
    demo_card: multi_agent/a2a_demo/illustration-agent-card.json
    demo_consumer: multi_agent/a2a_demo/agent.py

agent_as_tool:
  title: Agent as Tool vs sub_agents
  reference: https://google.github.io/adk-docs/agents/multi-agents
  intro: >-
    You can wire a specialist agent two ways — as a sub_agent (LLM routing) or
    as an AgentTool (explicit tool call). Use AgentTool when the parent should
    invoke the specialist on demand, not hand off the full conversation.
  comparison:
    - pattern: sub_agents
      control: LLM decides when to transfer the conversation
      use_when: Dynamic routing — billing vs technical, greeter → team
      demo: customer_service
    - pattern: AgentTool
      control: Parent calls specialist like any other tool
      use_when: Explicit subtask — search, then plan; parent keeps control
      demo: foundational/geography_assistant
  before_structure: |
    root_agent
     ├── search_agent (sub_agent)
     │    └── VertexAiSearchTool
     └── room_planner_agent (sub_agent)
  after_structure: |
    root_agent
     ├── AgentTool(search_agent)  → tool call on demand
     │    └── VertexAiSearchTool
     └── room_planner_agent (sub_agent)
  migration_steps:
    - Add AgentTool(agent=search_agent, skip_summarization=False) to tools
    - Remove search_agent from sub_agents — keep only coordinators there
    - Parent instruction should say when to call the search tool vs delegate
  code_example: |
    from google.adk.tools import AgentTool

    root_agent = LlmAgent(
        name="paint_agent",
        instruction="Use the search tool for product lookup, then plan the room.",
        sub_agents=[room_planner_agent],
        tools=[
            set_session_value,
            AgentTool(agent=search_agent, skip_summarization=False),
        ],
    )
  skip_summarization: >-
    False (default) — parent receives summarized specialist output.
    True — parent gets raw specialist response.

custom_agents:
  title: When to use custom agents (BaseAgent)
  reference: https://google.github.io/adk-docs/agents/custom-agents
  rule_of_thumb: >-
    Default to workflow agents. Only use custom agents when you've confirmed
    that Sequential, Parallel, and Loop cannot handle your conditional logic.
  when_needed:
    - name: Conditional skipping
      example: "IF condition THEN skip Agent B and go directly to Agent C"
      why: Workflow agents run every sub-agent in their pattern
    - name: Dynamic routing
      example: "IF type == billing THEN billing_agent ELSE general_agent"
      why: Workflow agents cannot branch based on runtime conditions
    - name: Complex early exit
      example: "IF quality_score > 8 THEN exit loop early"
      why: LoopAgent max_iterations is not enough for complex exit logic
  decision_framework:
    - question: Can I solve this with Sequential / Parallel / Loop?
      yes: Use workflow agents (recommended)
      no: Continue to next question
    - question: Do I need conditional logic?
      simple: Consider a custom agent
      complex: Use a custom agent (advanced)
  tradeoffs:
    - factor: Maintenance
      workflow: Maintained by ADK
      custom: You maintain it
    - factor: Testing
      workflow: Standard patterns
      custom: Custom test cases
    - factor: Debugging
      workflow: Clear execution flow
      custom: More complex flow
  preview_pattern: >-
    Subclass BaseAgent, implement async _run_async_impl(ctx), read state,
    yield events from the chosen sub-agent run_async(ctx).
  demo: conditional_router

state_namespaces_workflow:
  title: State namespaces in multi-agent workflows
  reference: https://google.github.io/adk-docs/sessions/state
  intro: >-
    Effective state management lets workflows maintain context, respect user
    preferences, and coordinate parallel execution. All agents in a workflow
    share one session state — output_key writes, {key} reads, state accumulates.
  namespaces:
    - prefix: "(session)"
      workflow_use: Workflow outputs and intermediate results
      examples: document_content, topics, sentiment, summary
    - prefix: "user:"
      workflow_use: User preferences that affect processing
      examples: "user:summary_format"
    - prefix: "app:"
      workflow_use: Global configuration for workflows
      examples: app-wide defaults
    - prefix: "temp:"
      workflow_use: Rarely needed in basic workflows
      examples: turn-scoped scratch values
  parallel_rules:
    - Use distinct output_key for each parallel agent
    - Aggregator reads all keys using {key} templating
    - State is merged after the parallel stage completes
  demo: doc_processor
  test_scenarios:
    - name: "Test 1 — Process a document"
      query: >-
        Process this document: "The new product launch exceeded expectations. Sales jumped
        40% in the first week. Customer feedback has been overwhelmingly positive, with 95%
        satisfaction ratings."
      expected:
        - Intake extracts and structures content
        - Topic and sentiment analyzers run in parallel
        - Summarizer creates summary (default bullet points — no user preference set)
        - All state preserved for follow-up questions
    - name: "Test 2 — Follow-up in same conversation"
      query: "What topics did you identify?"
      expected:
        - Agent references topics from session state in the same conversation

agent_communication:
  intro: >-
    Agents communicate by reading from and writing to shared session state.
    Without state, each agent works in isolation — the writer cannot see the
    researcher's output.
  primary_pattern:
    write: "output_key — saves agent response to session.state"
    read: "{key} — ADK injects state value into instruction before the agent runs"
  flow: Researcher → state[research_findings] → Writer → state[draft_article] → Editor
  reference: https://google.github.io/adk-docs/agents/multi-agents#communication
  patterns:
    - name: "output_key + {key}"
      use_when: Data flowing through pipelines (most common)
      demo: research_pipeline
    - name: sub_agents (LLM routing)
      use_when: Dynamic routing based on request content
      demo: customer_service
    - name: RemoteA2aAgent (A2A)
      use_when: Remote agent on another service, team, or network
      demo: a2a_demo
    - name: AgentTool
      use_when: Explicit control, specialized subtasks
      demo: foundational/geography_assistant

film_concept_workflow:
  title: Film concept team — Sequential + Loop + Parallel
  folder: film_concept_team
  description: >-
    Full workflow capstone: greeter → film_concept_team (SequentialAgent) runs
    writers_room (LoopAgent), preproduction_team (ParallelAgent), then file_writer.
    Combines all three workflow agent types with shared session state.
  reference: https://google.github.io/adk-docs/agents/workflow-agents/
  architecture_note: >-
    The user provides minimal input (e.g. "Ada Lovelace"), then the agent
    workflow takes over. Nested workflow agents — Sequential contains Loop
    and Parallel stages before the final file write.
  steps:
    - id: greeter
      agent: greeter
      note: Ask for historical subject; save PROMPT; delegate to film_concept_team
      status: implemented
    - id: writers_room
      agent: writers_room (LoopAgent)
      note: researcher → screenwriter → critic (iterate or exit_loop)
      status: implemented
    - id: preproduction
      agent: preproduction_team (ParallelAgent)
      note: box_office_researcher + casting_agent run concurrently
      status: implemented
    - id: file_writer
      agent: file_writer
      note: Aggregate PLOT_OUTLINE + reports; write movie_pitches/*.txt
      status: implemented
  loop_flow:
    - researcher — Wikipedia research → append_to_state research
    - screenwriter — draft/improve PLOT_OUTLINE using research and feedback
    - critic — exit_loop if good, else CRITICAL_FEEDBACK → next iteration
  parallel_flow:
    - box_office_researcher — output_key box_office_report from {PLOT_OUTLINE?}
    - casting_agent — output_key casting_report from {PLOT_OUTLINE?}
  state_keys:
    - key: PROMPT
      writer: greeter (append_to_state)
      readers: researcher, screenwriter
    - key: research
      writer: researcher (append_to_state + Wikipedia)
      readers: screenwriter, critic
    - key: PLOT_OUTLINE
      writer: screenwriter (append_to_state)
      readers: critic, preproduction agents, file_writer
    - key: CRITICAL_FEEDBACK
      writer: critic (append_to_state)
      readers: researcher, screenwriter
    - key: box_office_report
      writer: box_office_researcher (output_key)
      readers: file_writer
    - key: casting_report
      writer: casting_agent (output_key)
      readers: file_writer
  tool_state_pattern:
    write: "tool_context.state[field] = existing + [response]"
    read: "{field?} in agent instruction"
    exit: "exit_loop tool — critic ends the LoopAgent when outline is ready"
    parallel: "output_key per parallel branch — distinct keys avoid state conflicts"
    note: >-
      Sequential runs loop → parallel → file. Loop sub-agents run in order each
      iteration. Parallel agents run concurrently after the loop exits.
  output: movie_pitches/*.txt
  test_scenarios:
    - name: "Ada Lovelace biopic"
      query: Ada Lovelace
      expected:
        - Greeter saves PROMPT and delegates to film_concept_team
        - writers_room loop — researcher, screenwriter, critic (may repeat)
        - preproduction_team — box office + casting reports in parallel
        - file_writer saves full pitch txt under movie_pitches/

customer_service_app_multi_agent:
  title: Customer Service Multi-Agent App
  folder: customer_service_app_multi_agent
  description: >-
    Capstone: intake → parallel billing + technical research → final response.
    Full pipeline in multi_agent/customer_service_app_multi_agent/agent.py.
  steps:
    - id: 1
      name: intake
      status: implemented
      note: Extract ticket details from user request
    - id: 2
      name: parallel_specialists
      status: implemented
      note: billing_researcher + technical_researcher run concurrently
    - id: 3
      name: responder
      status: implemented
      note: Create final response from all state keys
  state_agents:
    - agent: intake
      role: Extract ticket info
      output_key: ticket_info
      reads: user request
    - agent: billing_researcher
      role: Research billing issues
      output_key: billing_findings
      reads: ticket_info
    - agent: technical_researcher
      role: Research technical issues
      output_key: technical_findings
      reads: ticket_info
    - agent: responder
      role: Create final response
      output_key: null
      reads: ticket_info, billing_findings, technical_findings
  test_scenarios:
    - name: "Test 1 — Billing issue"
      query: >-
        I was charged twice for my subscription last month.
        The charge was on December 15th.
      expected:
        - "Intake extracts: billing issue, duplicate charge, December 15th date"
        - Billing researcher finds relevant billing policies
        - Technical researcher says no technical issues
        - Response agent creates a helpful billing-focused answer
    - name: "Test 2 — Technical issue"
      query: >-
        The app crashes every time I try to upload a photo.
        I'm using an iPhone 14.
      expected:
        - "Intake extracts: technical issue, upload crash, iPhone 14"
        - Billing researcher says no billing issues
        - Technical researcher finds troubleshooting steps
        - Response agent creates a helpful technical answer
    - name: "Test 3 — Both billing and technical"
      query: >-
        I can't log in to my account and I think I'm being charged even though I canceled.
      expected:
        - "Intake extracts: both billing AND technical issues"
        - Billing researcher investigates the charging issue
        - Technical researcher investigates the login issue
        - Response agent addresses both issues

mcp_info:
  registry: https://registry.modelcontextprotocol.io
  connection_types:
    - name: StdioConnectionParams
      use: Local servers via subprocess (development)
    - name: SseConnectionParams
      use: Remote servers via HTTP (production)

tool_types:
  - type: Built-in
    complexity: Low
    setup: Import and use
    use_when: "Common capabilities (search, code execution, RAG)"
    example: google_search
  - type: Function Tools
    complexity: Medium
    setup: Write Python function
    use_when: Custom business logic
    example: get_capital_city
  - type: Agent-as-Tool
    complexity: Medium-High
    setup: Specialized sub-agent
    use_when: Specialized reasoning (e.g. Google Search + other tools)
    example: GoogleSearchAgentTool

module_recap:
  track: foundational
  title: "Modules 1–2 Recap"
  summary: "Session state is a dictionary. output_key writes agent output to state. {key} templating reads state into instructions."
  question: "How long does state persist?"
  answer: "State namespaces control persistence scope — not all state should live forever."

deployment:
  title: Deploy ADK agents to Google Cloud
  adk_docs: https://google.github.io/adk-docs/deploy/
  agent_engine_docs: https://google.github.io/adk-docs/deploy/agent-engine/
  cloud_run_docs: https://google.github.io/adk-docs/deploy/cloud-run/
  intro: >-
    ADK provides two GCP deployment options. Both give you a public URL, 24/7
    availability, and automatic scaling. When deployed, agents automatically
    use VertexAiSessionService for persistent, managed session state (replacing
    local InMemorySessionService).
  local_vs_cloud:
    - factor: Access
      local: http://localhost:8000 (your machine only)
      cloud: Public HTTPS URL (globally accessible)
    - factor: Availability
      local: Only while Terminal is running
      cloud: 24/7 automatic
    - factor: Session state
      local: InMemorySessionService (lost on restart)
      cloud: VertexAiSessionService (persistent)
    - factor: Use case
      local: Development and testing (adk web)
      cloud: Production, team sharing, integrations
  platforms:
    - id: agent_engine
      name: Vertex AI Agent Engine
      tagline: Fully managed, ADK-native — simplest path for Python agents
      languages: Python only
      session_service: VertexAiSessionService (automatic)
      command: >-
        adk deploy agent_engine --project=PROJECT --region=us-central1
        --staging_bucket=gs://BUCKET --display_name="My Agent" /path/to/agent
      best_for:
        - Standard ADK Python agents
        - Simplest one-command deployment
        - Automatic session and memory services
        - No Docker knowledge required
    - id: cloud_run
      name: Cloud Run
      tagline: Serverless containers — flexible, multi-language
      languages: Python, Go, Java
      session_service: Manual configuration (or Agent Engine instance for Memory Bank)
      command: >-
        adk deploy cloud_run --project=PROJECT --region=us-central1
        --service_name=my-agent --with_ui /path/to/agent
      best_for:
        - Multi-language agents (Go, Java)
        - Deploy web UI with agent (--with_ui)
        - Custom container dependencies
        - Fine-grained scaling control
  comparison:
    - factor: Ease of use
      agent_engine: Easiest (ADK-native, one command)
      cloud_run: Moderate (container concepts)
    - factor: Languages
      agent_engine: Python only
      cloud_run: Python, Go, Java
    - factor: Session service
      agent_engine: VertexAiSessionService (automatic)
      cloud_run: Manual setup
    - factor: Web UI
      agent_engine: Cloud Console only
      cloud_run: Can bundle UI (--with_ui)
    - factor: Docker knowledge
      agent_engine: Not needed
      cloud_run: Basic understanding helpful
  prerequisites:
    - Google Cloud project with billing enabled
    - gcloud CLI authenticated (gcloud auth login)
    - Vertex AI API enabled (gcloud services enable aiplatform.googleapis.com)
    - Cloud Run API enabled (gcloud services enable run.googleapis.com)
    - pip install 'google-cloud-aiplatform[adk,agent_engines]>=1.111'
  recommendation: >-
    Start with Agent Engine for standard ADK Python agents. Use Cloud Run when
    you need multi-language support, --with_ui, or custom containers.
  demo: weather_agent

memory_bank:
  title: Memory Bank — cross-session memory
  reference: https://google.github.io/adk-docs/sessions/memory/
  intro: >-
    While session state tracks one conversation, Memory Bank is long-term
    knowledge the agent can recall across all past chats. It answers:
    "What have I learned ACROSS ALL conversations?"
  session_vs_memory:
    session: "What's happening THIS conversation?"
    memory_bank: "What have I learned ACROSS ALL conversations?"
  lifecycle:
    - User interacts with agent
    - Conversation saved to Memory Bank (automatic via after_agent_callback)
    - LLM extracts meaningful information — preferences, interests, facts (not raw logs)
    - Later conversation — agent uses load_memory to search past memories
    - Agent responds with historical context
  features:
    - name: LLM-powered extraction
      description: >-
        Intelligently extracts and consolidates facts from conversations — not
        raw transcript storage.
    - name: Semantic search
      description: >-
        Understands intent when retrieving memories — not just keyword matching.
    - name: Managed service
      description: >-
        VertexAiMemoryBankService on GCP — no infrastructure setup; connects via
        Agent Engine (agentengine://AGENT_ENGINE_ID).
  local_vs_production:
    local_service: InMemoryMemoryService
    local_use: Prototyping and learning the memory API locally
    production_service: VertexAiMemoryBankService
    production_use: Production cross-session memory with extraction and semantic search
  pattern:
    save: after_agent_callback → callback_context.add_session_to_memory()
    recall: load_memory tool (or preload_memory for automatic preload each turn)
  production_config: >-
    adk web path/to/agents --memory_service_uri="agentengine://AGENT_ENGINE_ID"
  demo: memory_bank

state_namespaces:
  track: foundational
  namespaces:
    - prefix: "temp:"
      lifetime: Current turn only
      scope: Discarded after invocation
      example: "temp:step = validating"
    - prefix: "(none)"
      lifetime: Current session
      scope: Lost when session ends
      example: "topic = refunds"
    - prefix: "user:"
      lifetime: All sessions for user
      scope: Persists across conversations
      example: "user:theme = dark"
    - prefix: "app:"
      lifetime: Global for app
      scope: All users and sessions
      example: "app:version = 2.0"

